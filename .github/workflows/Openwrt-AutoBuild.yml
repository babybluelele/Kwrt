#=================================================
# Build OpenWrt using GitHub Actions (完整版)
#=================================================

name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Device target'
        default: 'x86_64'
  repository_dispatch:

env:
  REPO_TOKEN: ${{ secrets.TOKEN_KIDDIN }}
  PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
  PPPOE_PASSWD: ${{ secrets.PPPOE_PASSWD }}
  SCKEY: ${{ secrets.SCKEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_ID: ${{ secrets.DOCKER_ID }}
  DOCKER_PASSWD: ${{ secrets.DOCKER_PASSWD }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ github.event.client_payload.target != '' && github.event.client_payload.target || github.event.inputs.target }}"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Load settings.ini & set ARCH/MTARGET
      run: |
        TARGET=${{ matrix.target }}
        echo "TARGET=$TARGET" >> $GITHUB_ENV

        # 公共配置
        export $(grep -v '^#' devices/common/settings.ini | xargs)
        # 设备专属配置
        if [ -f "devices/$TARGET/settings.ini" ]; then
          export $(grep -v '^#' devices/$TARGET/settings.ini | xargs)
        fi

        echo "REPO_URL=$REPO_URL" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
        echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        echo "DIY_SH=$DIY_SH" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=$UPLOAD_FIRMWARE_FOR_ARTIFACT" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_FOR_RELEASE=$UPLOAD_FIRMWARE_FOR_RELEASE" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_TO_COWTRANSFER=$UPLOAD_FIRMWARE_TO_COWTRANSFER" >> $GITHUB_ENV
        echo "UPLOAD_FIRMWARE_TO_WETRANSFER=$UPLOAD_FIRMWARE_TO_WETRANSFER" >> $GITHUB_ENV

        # 设置 ARCH/MTARGET
        if [[ "$TARGET" == "x86_64" ]]; then
          echo "ARCH=linux/amd64" >> $GITHUB_ENV
          echo "MTARGET=x86_64" >> $GITHUB_ENV
        elif [[ "$TARGET" == "x86_generic" ]]; then
          echo "ARCH=linux/amd32" >> $GITHUB_ENV
          echo "MTARGET=x86_generic" >> $GITHUB_ENV
        elif [[ "$TARGET" =~ (armsr_armv8|qualcommax_ipq807x|mediatek_mt7622|mediatek_mt7981|mediatek_filogic|bcm27xx_bcm2710|qualcommax_ipq60xx|bcm4908_generic|sunxi_cortexa53) ]]; then
          echo "MTARGET=aarch64_cortex-a53" >> $GITHUB_ENV
        elif [[ "$TARGET" =~ (ramips_mt7621|ramips_mt7620|ramips_mt76x8) ]]; then
          echo "MTARGET=mipsel_24kc" >> $GITHUB_ENV
        elif [[ "$TARGET" == "ath79_nand" ]]; then
          echo "MTARGET=mips_24kc" >> $GITHUB_ENV
        elif [[ "$TARGET" =~ (ipq40xx_generic|bcm27xx_bcm2709|sunxi_cortexa7|qualcommax_ipq50xx) ]]; then
          echo "MTARGET=arm_cortex-a7_neon-vfpv4" >> $GITHUB_ENV
        elif [[ "$TARGET" == "amlogic_meson8b" ]]; then
          echo "MTARGET=arm_cortex-a5_vfpv4" >> $GITHUB_ENV
        elif [[ "$TARGET" == "bcm53xx" ]]; then
          echo "MTARGET=arm_cortex-a9" >> $GITHUB_ENV
        elif [[ "$TARGET" == "mvebu_cortexa9" ]]; then
          echo "MTARGET=arm_cortex-a9_vfpv3-d16" >> $GITHUB_ENV
        elif [[ "$TARGET" == "ipq806x_generic" ]]; then
          echo "MTARGET=arm_cortex-a15_neon-vfpv4" >> $GITHUB_ENV
        elif [[ "$TARGET" == "bcm27xx_bcm2708" ]]; then
          echo "MTARGET=arm_arm1176jzf-s_vfp" >> $GITHUB_ENV
        else
          echo "ARCH=linux/arm64" >> $GITHUB_ENV
          if [[ "$TARGET" == "bcm27xx_bcm2711" ]]; then
            echo "MTARGET=aarch64_cortex-a72" >> $GITHUB_ENV
          elif [[ "$TARGET" == rockchip* ]]; then
            echo "MTARGET=aarch64_generic" >> $GITHUB_ENV
          fi
        fi

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Get current date and version
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        VERSION="$(echo "${{github.event.action}}" | grep -Eo " [0-9.]+" | sed -e 's/ //')" || true
        [ "$VERSION" ] && echo "VERSION=$VERSION" >> $GITHUB_ENV || echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

    - name: Clone OpenWrt source
      run: |
        if [[ ! "$REPO_BRANCH" ]]; then
          REPO_BRANCH="openwrt-24.10"
        fi
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Prepare OpenWrt environment
      run: |
        mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir}
        ln -sf /mnt/openwrt/dl openwrt/dl
        ln -sf /mnt/openwrt/staging_dir openwrt/staging_dir
        ln -sf /mnt/openwrt/build_dir openwrt/build_dir

    - name: Load custom configs & DIY scripts
      run: |
        TARGET=${{ matrix.target }}
        cp -rf devices/common/. openwrt/
        cp -rf devices/$TARGET/. openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash devices/common/$DIY_SH
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/$TARGET/$CONFIG_FILE" ]; then
          cat devices/$TARGET/$CONFIG_FILE >> .config
        fi
        if [ -f "devices/$TARGET/$DIY_SH" ]; then
          chmod +x devices/$TARGET/$DIY_SH
          /bin/bash devices/$TARGET/$DIY_SH
        fi
        cp -rf ./diy/* ./ || true

    - name: Apply patches
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/${{ matrix.target }}/
        if ls devices/${{ matrix.target }}/*.bin.patch 1> /dev/null 2>&1; then
          git apply devices/${{ matrix.target }}/*.bin.patch
        fi
        find devices/${{ matrix.target }}/patches -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -0 -I % sh -c "patch -d ./ -R -B --merge -p1 < '%'"
        find devices/${{ matrix.target }}/patches -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -0 -I % sh -c "patch -d ./ -B --merge -p1 < '%'"

    - name: Defconfig
      run: |
        cd openwrt
        make defconfig

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo "Compiling with $(($(nproc)+1)) threads"
        make -j$(($(nproc)+1)) || (tail -50 build.log; exit 1)

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      if: env.UPLOAD_FIRMWARE_FOR_ARTIFACT == 'true'
      with:
        name: ${{ env.VERSION }}_${{ matrix.target }}
        path: openwrt/bin/targets/

    - name: Create GitHub Release
      if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: "openwrt/bin/targets/*"
        name: ${{ env.date2 }} ${{ matrix.target }}
        tag_name: ${{ env.date }}_${{ matrix.target }}
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN_KIDDIN }}

    - name: Telegram notification
      if: env.TELEGRAM_TOKEN
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
        -d text="🎉 OpenWrt ${{ env.VERSION }} ${{ matrix.target }} 编译完成 😋"

    - name: WeChat notification
      if: env.SCKEY
      run: |
        curl "https://sctapi.ftqq.com/${{ env.SCKEY }}.send?text=🎉OpenWrt_${{ env.VERSION }}_${{ matrix.target }}编译完成😋"

    - name: Clean old workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        token: ${{ secrets.TOKEN_KIDDIN }}
        retain_days: 100
        keep_minimum_runs: 0
