#=================================================
# Fork 自 kiddin9/Kwrt
# 修改：去掉了 kiddin9 专用的 token 和包更新步骤
# 使用 GITHUB_TOKEN 来触发本仓库的 build
#=================================================

name: Repo Dispatcher

on:
  workflow_dispatch:
    inputs:
      param:
        description: 'parameter'
        required: false
        default: ''

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cancel running workflows
      uses: styfle/cancel-workflow-action@main
      if: contains(github.event.inputs.param, 'cw')
      with:
        workflow_id: all
        access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Load Settings.ini
      run: |
        source "${GITHUB_WORKSPACE}/devices/common/settings.ini"
        if [ -f "devices/${{matrix.target}}/settings.ini" ]; then
          source "${GITHUB_WORKSPACE}/devices/${{matrix.target}}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV

    - name: Trigger Compile
      run: |
        sudo timedatectl set-timezone "$TZ"

        # 这里列出常见的 target，你可以根据需要删掉一些不编译的
        for target in \
          x86_64 x86_generic rockchip_armv8 \
          mediatek_mt7622 mediatek_filogic \
          ramips_mt7621 ramips_mt7620 ramips_mt76x8 \
          armsr_armv8 \
          ; do

          echo "Trigger build for $target"
          curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d "{\"event_type\": \"${target} ${{ github.event.inputs.param }}\", \"client_payload\": {\"target\": \"${target}\"}}"
        done
